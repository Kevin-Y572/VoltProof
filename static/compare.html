<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同题对照 —— 直接问 AI vs CircuitPilot</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --line:#2a2f3d; --text:#e6e8ee; --dim:#9aa1b2; --acc:#4f8cff; --ok:#3fb96f; --warn:#e6a23c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI",system-ui,"Microsoft YaHei",sans-serif; min-height:100vh; padding:24px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .bar { display:flex; gap:10px; margin-bottom:18px; }
  #q { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:10px 14px; font-size:14px; outline:none; }
  #run { background:var(--acc); border:none; color:#fff; border-radius:10px; padding:0 24px; cursor:pointer; font-size:14px; }
  #run:disabled { opacity:.5; cursor:wait; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; min-height:320px; }
  .panel h2 { font-size:14px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .panel.left h2 { color:var(--warn); } .panel.right h2 { color:var(--ok); }
  .panel .status { color:var(--dim); font-size:13px; }
  pre { background:#10131b; border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; font:12px/1.5 Consolas,monospace; margin-top:8px; color:#c8d2e8; white-space:pre-wrap; }
  .wave { max-width:100%; border-radius:8px; border:1px solid var(--line); margin-top:8px; }
  .metric { display:inline-block; background:#10131b; border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-size:12.5px; margin:6px 6px 0 0; }
  .metric b { color:var(--acc); font-family:Consolas,monospace; }
  .verdict { font-weight:600; margin-top:8px; }
  .verdict.ok { color:var(--ok); } .verdict.fail { color:var(--warn); }
  .note { color:var(--dim); font-size:12px; margin-top:12px; }
</style>
</head>
<body>
<h1>同题对照：同一个问题，两种回答</h1>
<div class="sub">左侧：直接问大模型（只得到文字） · 右侧：CircuitPilot（每个数字都来自 ngspice 实测）</div>

<div class="bar">
  <input id="q" value="设计一个截止频率1kHz的RC低通滤波器，并告诉我它的实际增益特性">
  <button id="run" onclick="runBoth()">运行对照</button>
</div>

<div class="cols">
  <div class="panel left">
    <h2>直接问 AI</h2>
    <div class="status" id="l-status">等待运行</div>
    <div id="l-body"></div>
  </div>
  <div class="panel right">
    <h2>CircuitPilot（仿真在环）</h2>
    <div class="status" id="r-status">等待运行</div>
    <div id="r-body"></div>
  </div>
</div>
<div class="note">提示：把左侧给出的电路拿到 ngspice 里跑，参数可能是编的；右侧电路经过了真实仿真，指标是算出来的。</div>

<script>
async function runBoth() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  run.disabled = true;
  lStatus('请求中…'); rStatus('生成网表 → 仿真验证中…');
  document.getElementById('l-body').innerHTML = '';
  document.getElementById('r-body').innerHTML = '';
  const [l, r] = await Promise.allSettled([
    fetch('/demo/raw', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: q})}).then(x=>x.json()),
    fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: q})}).then(x=>x.json()),
  ]);
  // 左：裸模型
  if (l.status === 'fulfilled' && l.value.text) {
    lStatus('完成（仅文字，未经验证）');
    document.getElementById('l-body').innerHTML = `<pre>${escapeHtml(l.value.text)}</pre>`;
  } else { lStatus('失败'); }
  // 右：产品
  if (r.status === 'fulfilled' && !r.value.error) {
    const d = r.value;
    rStatus(`完成 · ${d.elapsed}s`);
    const metrics = Object.entries(d.metrics||{}).map(([k,v])=>`<span class="metric">${k} <b>${v}</b></span>`).join('');
    const wave = d.waveform_b64 ? `<img class="wave" src="data:image/png;base64,${d.waveform_b64}">` : '';
    const checks = d.checks || [];
    const checksHtml = checks.length
      ? `<div style="margin-top:8px">${checks.map(c =>
          `<span class="metric" style="${c.ok ? '' : 'border-color:var(--warn)'}">${c.ok ? '✅' : '❌'} ${escapeHtml(c.name)}</span>`).join('')}</div>` : '';
    document.getElementById('r-body').innerHTML =
      `<div class="verdict ${d.ok?'ok':'fail'}">${d.ok?'✅ 仿真验证通过':'⚠️ 未通过'}</div>${metrics}${wave}${checksHtml}` +
      `<pre>${escapeHtml(d.netlist)}</pre>`;
  } else { rStatus('失败'); }
  run.disabled = false;
}

function lStatus(t){ document.getElementById('l-status').textContent = t; }
function rStatus(t){ document.getElementById('r-status').textContent = t; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
