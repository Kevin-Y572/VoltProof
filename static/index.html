<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CircuitPilot —— 电路仿真 Copilot</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --line:#2a2f3d; --text:#e6e8ee; --dim:#9aa1b2; --acc:#4f8cff; --ok:#3fb96f; --warn:#e6a23c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:17px; } header span { color:var(--dim); font-size:12px; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:860px; width:100%; margin:0 auto; }
  .msg.user .bubble { background:#24304a; border-radius:12px; padding:10px 14px; display:inline-block; }
  .evidence { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .verdict { font-weight:600; margin-bottom:8px; }
  .verdict.ok { color:var(--ok); } .verdict.fail { color:var(--warn); }
  .metrics { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .metric { background:#10131b; border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:13px; }
  .metric b { color:var(--acc); font-family:Consolas,monospace; }
  .wave { max-width:100%; border:1px solid var(--line); border-radius:8px; margin:8px 0; }
  details { margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; }
  summary { cursor:pointer; color:var(--dim); font-size:12.5px; }
  pre { background:#10131b; border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; font:12px/1.5 Consolas,monospace; margin-top:8px; color:#c8d2e8; }
  .interp { color:var(--text); margin-top:8px; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:#1d2b45; color:var(--acc); margin-right:6px; }
  footer { border-top:1px solid var(--line); padding:14px 20px; display:flex; gap:10px; }
  #input { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:10px 14px; font-size:14px; outline:none; resize:none; }
  #send { background:var(--acc); border:none; color:#fff; border-radius:10px; padding:0 22px; cursor:pointer; font-size:14px; }
  #send:disabled { opacity:.5; cursor:wait; }
  .hint { max-width:860px; margin:0 auto; color:var(--dim); font-size:12.5px; }
  .hint code { background:#1d2b45; padding:1px 6px; border-radius:4px; cursor:pointer; color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>CircuitPilot</h1>
  <span>每一份回答都附带仿真证据 · ngspice 验证</span>
  <span id="wsInfo" title="点击切换工作区" style="margin-left:auto;cursor:pointer;color:var(--acc);font-size:12px;max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  <button id="llmBtn" title="大模型设置（供应商 / API Key / 模型）" style="background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:3px 10px;font-size:12.5px;cursor:pointer">⚙ 模型</button>
  <button id="histBtn" title="历史任务" style="background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:3px 10px;font-size:12.5px;cursor:pointer">历史</button>
</header>

<div id="chat">
  <div class="hint">
    试试：
    <code onclick="fill('设计一个截止频率1kHz的RC低通滤波器')">RC 低通滤波器</code>
    <code onclick="fill('用理想运放设计一个增益-10倍的反相放大器，仿真验证')">反相放大器</code>
    <code onclick="fill('设计桥式整流+电容滤波电路，220V/50Hz降压到12V，纹波<1V')">整流滤波</code>
    <span id="chipInfo" style="display:none;margin-top:6px;color:var(--acc)"></span>
  </div>
</div>

<aside id="histPanel" style="display:none;position:fixed;right:0;top:49px;bottom:66px;width:380px;background:var(--card);border-left:1px solid var(--line);overflow-y:auto;padding:12px;z-index:30">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
    <b>历史任务</b><span id="histWs" style="color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  </div>
  <div id="histList"></div>
</aside>

<div id="wsDialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:500px;max-width:92vw">
    <b>切换工作区</b>
    <p style="color:var(--dim);font-size:12px;margin:6px 0">输入本地目录的绝对路径。之后所有产物（电路/波形/报告）与会话状态都只保存在该目录内，拷走文件夹即完整归档。</p>
    <input id="wsInput" style="width:100%;background:#10131b;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;outline:none" placeholder="D:\projects\my-circuits">
    <div id="wsRecent" style="margin-top:8px"></div>
    <div id="wsErr" style="color:var(--warn);font-size:12px;margin-top:6px"></div>
    <div style="margin-top:12px;text-align:right">
      <button id="wsCancelBtn" style="background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 14px;cursor:pointer">取消</button>
      <button id="wsOpenBtn" style="background:var(--acc);border:none;color:#fff;border-radius:8px;padding:6px 16px;cursor:pointer;margin-left:8px">打开</button>
    </div>
  </div>
</div>

<div id="llmDialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:500px;max-width:92vw">
    <b>大模型设置</b>
    <p style="color:var(--dim);font-size:12px;margin:6px 0">任何 OpenAI 兼容供应商均可。API Key 只保存在本机 settings.json，不会回显完整内容，也不会发给除供应商以外的任何地方。</p>
    <label style="color:var(--dim);font-size:12px;display:block;margin:8px 0 4px">Base URL</label>
    <input id="llmUrl" style="width:100%;background:#10131b;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;outline:none" placeholder="https://api.deepseek.com">
    <label style="color:var(--dim);font-size:12px;display:block;margin:8px 0 4px">API Key <span id="llmKeyState" style="color:var(--acc)"></span></label>
    <input id="llmKey" type="password" autocomplete="off" style="width:100%;background:#10131b;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;outline:none" placeholder="sk-…">
    <label style="color:var(--dim);font-size:12px;display:block;margin:8px 0 4px">模型</label>
    <div style="display:flex;gap:8px">
      <input id="llmModel" list="llmModelList" style="flex:1;background:#10131b;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;outline:none" placeholder="deepseek-flash（可点右侧按钮拉取列表）">
      <datalist id="llmModelList"></datalist>
      <button id="llmFetchModels" style="background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:0 12px;font-size:12.5px;cursor:pointer;white-space:nowrap">获取列表</button>
    </div>
    <div id="llmMsg" style="color:var(--warn);font-size:12px;margin-top:8px;min-height:16px"></div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
      <span style="color:var(--dim);font-size:11.5px">留空的项保持不变 · Key 输入框留空 = 不修改</span>
      <span>
        <button id="llmCancelBtn" style="background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 14px;cursor:pointer">取消</button>
        <button id="llmSaveBtn" style="background:var(--acc);border:none;color:#fff;border-radius:8px;padding:6px 16px;cursor:pointer;margin-left:8px">保存</button>
      </span>
    </div>
  </div>
</div>

<footer>
  <input type="file" id="file" accept=".cir,.sp,.ckt,.net,.spi,.spice,.txt,.md" hidden>
  <button id="attach" title="上传网表或文本文件" style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:16px;cursor:pointer">📎</button>
  <textarea id="input" rows="1" placeholder="用自然语言描述电路需求…（Enter 发送）"></textarea>
  <button id="send">发送</button>
</footer>

<script>
const session_id = crypto.randomUUID().slice(0, 12);
let attachment = null;  // {filename, content}

// 元素引用集中声明，必须在所有使用点之前——原布局把声明放在脚本尾部，
// 中段的 attachBtn/file 引用触发 TDZ ReferenceError，整个脚本在此中断
// （发送/回车/附件/工作区功能全部失效，页面只是看起来正常）
const input = document.getElementById('input'), send_ = document.getElementById('send'), chat = document.getElementById('chat');
const attachBtn = document.getElementById('attach'), file = document.getElementById('file'), chipInfo = document.getElementById('chipInfo');
const wsInfo = document.getElementById('wsInfo'), wsDialog = document.getElementById('wsDialog'),
      wsInput = document.getElementById('wsInput'), wsRecent = document.getElementById('wsRecent'),
      wsErr = document.getElementById('wsErr'), histBtn = document.getElementById('histBtn'),
      histPanel = document.getElementById('histPanel'), histList = document.getElementById('histList'),
      histWs = document.getElementById('histWs');
const llmBtn = document.getElementById('llmBtn'), llmDialog = document.getElementById('llmDialog'),
      llmUrl = document.getElementById('llmUrl'), llmKey = document.getElementById('llmKey'),
      llmKeyState = document.getElementById('llmKeyState'), llmModel = document.getElementById('llmModel'),
      llmModelList = document.getElementById('llmModelList'), llmFetchModels = document.getElementById('llmFetchModels'),
      llmMsg = document.getElementById('llmMsg');

function fill(text) { input.value = text; input.focus(); }

attachBtn.addEventListener('click', () => file.click());
file.addEventListener('change', async () => {
  const f = file.files[0];
  if (!f) return;
  if (f.size > 256 * 1024) { alert('文件过大（>256KB）'); file.value = ''; return; }
  attachment = { filename: f.name, content: await f.text() };
  attachBtn.textContent = '📎✓';
  attachBtn.title = `已附加：${f.name}（点击更换）`;
  chipInfo.textContent = `附件：${f.name}` + (/\\.(cir|sp|ckt|net|spi|spice)$/i.test(f.name) ? '（将直接仿真验证）' : '（内容并入需求）');
  chipInfo.style.display = 'block';
  file.value = '';
  input.focus();
});

async function send() {
  const text = input.value.trim();
  if (!text && !attachment) return;
  const att = attachment;
  input.value = ""; send_.disabled = true;
  attachment = null; attachBtn.textContent = '📎'; chipInfo.style.display = 'none';
  addMsg('user', text + (att ? ` <span style="color:var(--acc)">📎${escapeHtml(att.filename)}</span>` : ''));
  const holder = addMsg('assistant', '<span style="color:var(--dim)">仿真验证中…（生成网表 → ngspice 执行 → 指标计算）</span>');
  try {
    const r = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id, message: text || '请仿真验证附件电路', attachment: att})
    });
    const d = await r.json();
    if (d.error) holder.innerHTML = `<div class="evidence"><div class="verdict fail">出错了</div>${d.error}</div>`;
    else holder.innerHTML = renderEvidence(d);
  } catch (e) {
    holder.innerHTML = `<div class="evidence">请求失败：${e}</div>`;
  }
  send_.disabled = false; input.focus();
}

function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'user') div.innerHTML = `<div class="bubble">${escapeHtml(html)}</div>`;
  else div.innerHTML = html;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderEvidence(d) {
  const metrics = Object.entries(d.metrics || {}).map(([k, v]) => `<div class="metric">${k} <b>${v}</b></div>`).join('');
  const wave = d.waveform_b64 ? `<img class="wave" src="data:image/png;base64,${d.waveform_b64}" alt="仿真波形">` : '';
  const sch = d.schematic_b64 ? `<img class="wave" src="data:image/png;base64,${d.schematic_b64}" alt="电路原理图">` : '';
  const retries = (d.retry_log || []).filter(r => r.stage !== 'generate');
  const retryHtml = retries.length
    ? `<details><summary>仿真在环日志（${retries.length} 次自动修复）</summary><pre>${escapeHtml(JSON.stringify(retries, null, 1))}</pre></details>` : '';
  const checks = d.checks || [];
  const checksHtml = checks.length
    ? `<details ${checks.some(c => !c.ok) ? 'open' : ''}><summary>验收明细（${checks.filter(c => c.ok).length}/${checks.length} 项通过）</summary>`
      + checks.map(c => `<div class="metric" style="margin:4px 0;${c.ok ? '' : 'border-color:var(--warn)'}">${c.ok ? '✅' : '❌'} ${escapeHtml(c.name)} <span style="color:var(--dim)">· ${escapeHtml(c.detail || '')}</span></div>`).join('')
      + '</details>' : '';
  return `<div class="evidence">
    <div class="verdict ${d.ok ? 'ok' : 'fail'}">${d.ok ? '✅ 仿真验证通过' : '⚠️ 自动修复后仍未通过'}</div>
    <div><span class="badge">实测指标</span><span class="badge">${d.elapsed}s</span></div>
    <div class="metrics">${metrics || '<span style="color:var(--dim)">无</span>'}</div>
    ${sch ? '<div><span class="badge">原理图（AI 生成）</span></div>' + sch : ''}
    ${wave}
    <div class="interp">${escapeHtml(d.interpretation || '')}</div>
    ${checksHtml}
    <details><summary>网表（ngspice）</summary><pre>${escapeHtml(d.netlist)}</pre></details>
    ${retryHtml}
  </div>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
send_.addEventListener('click', send);

// ---- 工作区（ZCode/dsh 模型：用户决定在哪个目录工作，产物全部留在其中）----
async function loadWsInfo() {
  try {
    const d = await (await fetch('/api/ws')).json();
    wsInfo.textContent = `📁 ${d.root}${d.is_default ? '（默认）' : ''} · ${d.tasks} 任务`;
  } catch (e) { wsInfo.textContent = '📁 工作区不可用'; }
}

function recentWs() { try { return JSON.parse(localStorage.getItem('cp_recent_ws') || '[]'); } catch { return []; } }
function rememberWs(p) {
  const arr = [p, ...recentWs().filter(x => x !== p)].slice(0, 8);
  localStorage.setItem('cp_recent_ws', JSON.stringify(arr));
}
function renderRecent() {
  const arr = recentWs();
  wsRecent.innerHTML = arr.length
    ? '<div style="color:var(--dim);font-size:12px;margin-bottom:4px">最近使用</div>' +
      arr.map(p => `<div class="wsRecentItem" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;margin:4px 0;cursor:pointer;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p)}</div>`).join('')
    : '';
  wsRecent.querySelectorAll('.wsRecentItem').forEach((el, i) => el.addEventListener('click', () => openWs(arr[i])));
}

async function openWs(p) {
  wsErr.textContent = '';
  try {
    const r = await fetch('/api/ws/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: p }) });
    const d = await r.json();
    if (!r.ok) { wsErr.textContent = d.error || '打开失败'; return; }
    rememberWs(d.root);
    wsDialog.style.display = 'none';
    loadWsInfo(); loadHistory();
  } catch (e) { wsErr.textContent = String(e); }
}

wsInfo.addEventListener('click', () => { wsErr.textContent = ''; renderRecent(); wsDialog.style.display = 'flex'; wsInput.focus(); });
document.getElementById('wsCancelBtn').addEventListener('click', () => wsDialog.style.display = 'none');
document.getElementById('wsOpenBtn').addEventListener('click', () => { if (wsInput.value.trim()) openWs(wsInput.value.trim()); });
wsInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('wsOpenBtn').click(); });

histBtn.addEventListener('click', () => {
  const show = histPanel.style.display === 'none';
  histPanel.style.display = show ? 'block' : 'none';
  if (show) loadHistory();
});

async function loadHistory() {
  let d;
  try { d = await (await fetch('/api/ws/tasks')).json(); } catch { return; }
  histWs.textContent = d.root || '';
  histList.innerHTML = '';
  if (!d.tasks || !d.tasks.length) {
    histList.innerHTML = '<div style="color:var(--dim);font-size:12px;margin-top:10px">暂无任务</div>';
    return;
  }
  for (const t of d.tasks) {
    const el = document.createElement('details');
    el.style.cssText = 'border-top:1px dashed var(--line);padding:8px 0;font-size:12.5px';
    const when = t.task_id.slice(0, 15).replace(/(\d{8})(\d{2})(\d{2})/, '$1 $2:$3');
    el.innerHTML = `<summary style="cursor:pointer">${t.ok ? '✅' : '⚠️'} <b>${escapeHtml(when)}</b>
      <span style="color:var(--dim)">${escapeHtml(t.request || '(无记录)')}</span></summary>
      <div class="histBody" style="margin-top:6px"><span style="color:var(--dim)">加载中…</span></div>`;
    el.addEventListener('toggle', async () => {
      if (!el.open) return;
      const body = el.querySelector('.histBody');
      const imgs = (t.files || []).filter(f => /\.png$/i.test(f));
      let html = imgs.map(f =>
        `<img src="/api/files/${encodeURIComponent(t.task_id)}/${encodeURIComponent(f)}" style="max-width:100%;border:1px solid var(--line);border-radius:6px;margin:4px 0" loading="lazy">`).join('');
      try {
        const ev = await (await fetch(`/api/files/${encodeURIComponent(t.task_id)}/evidence.json`)).json();
        const m = Object.entries(ev.metrics || {}).slice(0, 6)
          .map(([k, v]) => `<span class="metric" style="margin:2px 4px 2px 0">${k} <b>${v}</b></span>`).join('');
        html += `<div style="display:flex;flex-wrap:wrap;margin:6px 0">${m}</div>` +
          `<details><summary>网表</summary><pre style="max-height:200px">${escapeHtml(ev.netlist || '')}</pre></details>`;
      } catch (e) { /* evidence 缺失时只看图 */ }
      body.innerHTML = html || '<span style="color:var(--dim)">无预览文件</span>';
    }, { once: false });
    histList.appendChild(el);
  }
}

loadWsInfo();

// ---- 大模型设置（供应商 URL / API Key / 模型，OpenAI 兼容）----
async function loadLlmConfig() {
  try {
    const d = await (await fetch('/api/llm/config')).json();
    llmUrl.value = d.base_url || '';
    llmModel.value = d.model || '';
    llmKeyState.textContent = d.has_key ? `（已配置：${d.key_masked}）` : '（未配置）';
    llmKey.value = '';
    llmKey.placeholder = d.has_key ? '留空表示沿用当前 Key' : 'sk-…';
  } catch (e) { llmKeyState.textContent = ''; }
}

function openLlmDialog() {
  llmMsg.textContent = '';
  loadLlmConfig();
  llmDialog.style.display = 'flex';
}

llmBtn.addEventListener('click', openLlmDialog);
document.getElementById('llmCancelBtn').addEventListener('click', () => llmDialog.style.display = 'none');

llmFetchModels.addEventListener('click', async () => {
  llmMsg.style.color = 'var(--dim)';
  llmMsg.textContent = '正在拉取模型列表…';
  try {
    const body = {};
    if (llmUrl.value.trim()) body.base_url = llmUrl.value.trim();
    if (llmKey.value.trim()) body.api_key = llmKey.value.trim();
    const r = await fetch('/api/llm/models', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '拉取失败');
    llmModelList.innerHTML = d.models.map(m => `<option value="${escapeHtml(m)}"></option>`).join('');
    llmMsg.style.color = 'var(--ok)';
    llmMsg.textContent = `获取到 ${d.models.length} 个模型，点击模型输入框选择`;
    if (d.models.length && !d.models.includes(llmModel.value)) llmModel.focus();
  } catch (e) {
    llmMsg.style.color = 'var(--warn)';
    llmMsg.textContent = String(e.message || e) + '（可手动输入模型名）';
  }
});

document.getElementById('llmSaveBtn').addEventListener('click', async () => {
  llmMsg.style.color = 'var(--dim)';
  llmMsg.textContent = '保存中…';
  const body = {};
  if (llmUrl.value.trim()) body.base_url = llmUrl.value.trim();
  if (llmKey.value.trim()) body.api_key = llmKey.value.trim();
  if (llmModel.value.trim()) body.model = llmModel.value.trim();
  try {
    const r = await fetch('/api/llm/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '保存失败');
    llmMsg.style.color = 'var(--ok)';
    llmMsg.textContent = `已保存：${d.model} @ ${d.base_url}`;
    setTimeout(() => { llmDialog.style.display = 'none'; }, 600);
  } catch (e) {
    llmMsg.style.color = 'var(--warn)';
    llmMsg.textContent = String(e.message || e);
  }
});
</script>
</body>
</html>
